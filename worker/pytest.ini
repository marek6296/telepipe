[pytest]
pythonpath = src
testpaths = tests
asyncio_mode = auto
# Testy, ktoré potrebujú userbot.py / control_bot.py / main.py — vrátia sa v T10-T12.
norecursedirs = _pending_t12
# Jediná trieda v test_den.py importuje control_bot vnútri testu (zber preto
# prejde a súbor sa nedá karanténovať celý). Vráti sa v T12.
addopts = --deselect tests/test_den.py::TestVypisVBotovi
