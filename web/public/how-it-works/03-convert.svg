<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Placeholder mockup: a live chat with a voice note and a daily conversions chart">
  <defs>
    <linearGradient id="v-bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4d4d4d"/>
      <stop offset="0.5" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="v-glow" cx="0.2" cy="0.85" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="v-out" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6d6db"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#v-bg)"/>
  <rect width="600" height="600" fill="url(#v-glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M100 0V600M200 0V600M300 0V600M400 0V600M500 0V600"/>
    <path d="M0 100H600M0 200H600M0 300H600M0 400H600M0 500H600"/>
  </g>

  <!-- chat panel -->
  <g transform="translate(46 48)">
    <rect x="0" y="0" width="330" height="440" rx="22" fill="#2b2b2b" stroke="#4e4e4e" stroke-width="1.5"/>

    <!-- header -->
    <path d="M0 22a22 22 0 0 1 22-22h286a22 22 0 0 1 22 22v40H0z" fill="#333333"/>
    <circle cx="34" cy="32" r="14" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="58" y="24" width="78" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.62"/>
    <rect x="58" y="39" width="46" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.22"/>
    <line x1="0" y1="62" x2="330" y2="62" stroke="#3a3a3a"/>

    <!-- incoming -->
    <rect x="22" y="84" width="176" height="42" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#4d4d4d"/>
    <g fill="#ffffff" fill-opacity="0.36">
      <rect x="36" y="97" width="140" height="7" rx="3.5"/>
      <rect x="36" y="110" width="96" height="7" rx="3.5"/>
    </g>

    <!-- outgoing -->
    <rect x="118" y="138" width="190" height="54" rx="14" fill="url(#v-out)"/>
    <g fill="#0b0b0b" fill-opacity="0.6">
      <rect x="134" y="152" width="158" height="7" rx="3.5"/>
      <rect x="134" y="165" width="130" height="7" rx="3.5"/>
      <rect x="134" y="178" width="72" height="7" rx="3.5"/>
    </g>

    <!-- incoming short -->
    <rect x="22" y="204" width="118" height="34" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#4d4d4d"/>
    <rect x="36" y="217" width="84" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.36"/>

    <!-- voice note -->
    <rect x="118" y="250" width="190" height="50" rx="14" fill="url(#v-out)"/>
    <circle cx="142" cy="275" r="12" fill="#0b0b0b" fill-opacity="0.82"/>
    <path d="M139 270l8 5-8 5z" fill="#fafafa"/>
    <g fill="#0b0b0b" fill-opacity="0.55">
      <rect x="162" y="271" width="3" height="8" rx="1.5"/>
      <rect x="170" y="266" width="3" height="18" rx="1.5"/>
      <rect x="178" y="269" width="3" height="12" rx="1.5"/>
      <rect x="186" y="262" width="3" height="26" rx="1.5"/>
      <rect x="194" y="268" width="3" height="14" rx="1.5"/>
      <rect x="202" y="264" width="3" height="22" rx="1.5"/>
      <rect x="210" y="270" width="3" height="10" rx="1.5"/>
      <rect x="218" y="266" width="3" height="18" rx="1.5"/>
      <rect x="226" y="272" width="3" height="6" rx="1.5"/>
      <rect x="234" y="268" width="3" height="14" rx="1.5"/>
      <rect x="242" y="271" width="3" height="8" rx="1.5"/>
      <rect x="250" y="267" width="3" height="16" rx="1.5"/>
    </g>
    <rect x="272" y="271" width="24" height="7" rx="3.5" fill="#0b0b0b" fill-opacity="0.4"/>

    <!-- typing -->
    <rect x="22" y="316" width="72" height="30" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#4d4d4d"/>
    <g fill="#ffffff" fill-opacity="0.4">
      <circle cx="44" cy="331" r="3.5"/>
      <circle cx="58" cy="331" r="3.5"/>
      <circle cx="72" cy="331" r="3.5"/>
    </g>

    <!-- composer -->
    <line x1="0" y1="372" x2="330" y2="372" stroke="#3a3a3a"/>
    <rect x="22" y="390" width="242" height="34" rx="12" fill="#ffffff" fill-opacity="0.035" stroke="#4c4c4c"/>
    <rect x="36" y="403" width="92" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="290" cy="407" r="17" fill="#fafafa"/>
    <path d="M284 407h11m-4-4l4 4-4 4" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- stats panel -->
  <g transform="translate(330 306)">
    <rect x="0" y="0" width="228" height="246" rx="20" fill="#303030" stroke="#505050" stroke-width="1.5"/>
    <rect x="22" y="24" width="86" height="8" rx="4" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="22" y="44" width="74" height="24" rx="6" fill="#f4f4f5" fill-opacity="0.9"/>
    <rect x="106" y="52" width="40" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.22"/>

    <g fill="url(#v-bar)">
      <rect x="22" y="150" width="16" height="56" rx="4"/>
      <rect x="48" y="128" width="16" height="78" rx="4"/>
      <rect x="74" y="158" width="16" height="48" rx="4"/>
      <rect x="100" y="112" width="16" height="94" rx="4"/>
      <rect x="126" y="136" width="16" height="70" rx="4"/>
      <rect x="152" y="96" width="16" height="110" rx="4"/>
      <rect x="178" y="120" width="16" height="86" rx="4"/>
    </g>
    <line x1="22" y1="212" x2="206" y2="212" stroke="#4a4a4a"/>
    <g fill="#ffffff" fill-opacity="0.14">
      <rect x="22" y="222" width="16" height="6" rx="3"/>
      <rect x="48" y="222" width="16" height="6" rx="3"/>
      <rect x="74" y="222" width="16" height="6" rx="3"/>
      <rect x="100" y="222" width="16" height="6" rx="3"/>
      <rect x="126" y="222" width="16" height="6" rx="3"/>
      <rect x="152" y="222" width="16" height="6" rx="3"/>
      <rect x="178" y="222" width="16" height="6" rx="3"/>
    </g>
  </g>

  <!-- subscriber chip -->
  <rect x="352" y="82" width="196" height="60" rx="16" fill="#353535" fill-opacity="0.95" stroke="#545454"/>
  <rect x="372" y="100" width="24" height="24" rx="8" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="408" y="102" width="112" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="408" y="117" width="66" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.22"/>
</svg>
