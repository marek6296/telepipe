<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Placeholder mockup: signing in to Telegram with a phone code">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d4d4d"/>
      <stop offset="0.55" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="c-glow" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#242424"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#c-bg)"/>
  <rect width="600" height="600" fill="url(#c-glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M60 0V600M180 0V600M300 0V600M420 0V600M540 0V600"/>
    <path d="M0 60H600M0 180H600M0 300H600M0 420H600M0 540H600"/>
  </g>

  <!-- phone -->
  <g transform="translate(178 70)">
    <rect x="0" y="0" width="244" height="470" rx="40" fill="#2e2e2e" stroke="#5a5a5a" stroke-width="1.5"/>
    <rect x="9" y="9" width="226" height="452" rx="33" fill="url(#c-screen)" stroke="#3a3a3a"/>
    <rect x="94" y="20" width="56" height="7" rx="3.5" fill="#4c4c4c"/>

    <!-- title -->
    <rect x="38" y="72" width="130" height="13" rx="6.5" fill="#e8e8e8" fill-opacity="0.88"/>
    <rect x="38" y="98" width="168" height="8" rx="4" fill="#ffffff" fill-opacity="0.2"/>

    <!-- phone number field -->
    <rect x="30" y="140" width="184" height="46" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#5a5a5a"/>
    <rect x="44" y="158" width="26" height="10" rx="5" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="80" y="158" width="82" height="10" rx="5" fill="#ffffff" fill-opacity="0.28"/>

    <!-- code boxes -->
    <g fill="#ffffff" fill-opacity="0.04" stroke="#5e5e5e">
      <rect x="30" y="212" width="40" height="50" rx="11"/>
      <rect x="78" y="212" width="40" height="50" rx="11"/>
      <rect x="126" y="212" width="40" height="50" rx="11"/>
      <rect x="174" y="212" width="40" height="50" rx="11"/>
    </g>
    <g fill="#f2f2f2" fill-opacity="0.85">
      <rect x="43" y="231" width="14" height="12" rx="3"/>
      <rect x="91" y="231" width="14" height="12" rx="3"/>
    </g>
    <rect x="139" y="222" width="1.5" height="30" rx="0.75" fill="#ffffff" fill-opacity="0.55"/>

    <!-- primary button -->
    <rect x="30" y="292" width="184" height="44" rx="12" fill="#fafafa"/>
    <rect x="90" y="309" width="64" height="10" rx="5" fill="#0c0c0c"/>

    <!-- status rows -->
    <g>
      <circle cx="40" cy="372" r="5" fill="#ffffff" fill-opacity="0.75"/>
      <rect x="56" y="367" width="104" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.22"/>
      <circle cx="40" cy="402" r="5" fill="#ffffff" fill-opacity="0.32"/>
      <rect x="56" y="397" width="140" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.14"/>
      <circle cx="40" cy="432" r="5" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="56" y="427" width="80" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.1"/>
    </g>
  </g>

  <!-- floating chips -->
  <g>
    <rect x="42" y="150" width="132" height="52" rx="14" fill="#353535" fill-opacity="0.94" stroke="#545454"/>
    <rect x="58" y="166" width="20" height="20" rx="6" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="88" y="169" width="68" height="8" rx="4" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="88" y="182" width="44" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>

    <rect x="428" y="392" width="132" height="52" rx="14" fill="#353535" fill-opacity="0.94" stroke="#545454"/>
    <rect x="444" y="408" width="20" height="20" rx="6" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="474" y="411" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="474" y="424" width="38" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>
  </g>
</svg>
